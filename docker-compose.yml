services:
  postgres:
    image: postgres:16-alpine
    container_name: finbridge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: finbridge
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: finbridge-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  # One-time init container: creates DB schema and seeds demo data.
  # Runs before the api service on every cold start; exits 0 on success.
  # Safe to re-run — seed is idempotent (upsert-on-conflict pattern).
  api-init:
    image: finbridge-api-init:latest
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api-init
    container_name: finbridge-api-init
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/finbridge
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    image: finbridge-api:latest
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: finbridge-api
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/finbridge
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NODE_ENV: production
      PORT: 3001
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api-init:
        condition: service_completed_successfully
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3001/api/v1/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  web:
    image: finbridge-web:latest
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
      args:
        # NEXT_PUBLIC_* vars must be baked at build time — runtime env has no effect
        NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
    container_name: finbridge-web
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  uploads_data:
